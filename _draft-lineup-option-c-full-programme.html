<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line-up · Option C · Editorial</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { background:#FAF6F1; }
  .lu-topbar { display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; background:#fff; border-bottom:1px solid rgba(63,39,67,0.08); }
  .lu-topbar img { height:44px; }
  .lu-topbar a { color:var(--emerald); font-weight:600; text-decoration:none; }
  .lu-head { text-align:center; padding:3.5rem 1.5rem 1rem; max-width:760px; margin:0 auto; }
  .lu-eyebrow { letter-spacing:0.22em; text-transform:uppercase; font-size:0.8rem; font-weight:700; color:var(--gold); }
  .lu-head h1 { font-family:'Playfair Display',Georgia,serif; font-size:3rem; color:var(--plum-deep); margin:0.4rem 0 0.6rem; }
  .lu-head p { color:var(--text-light); font-size:1.08rem; }
  .lu-filters { display:flex; flex-wrap:wrap; gap:0.55rem; justify-content:center; max-width:900px; margin:2rem auto 2.5rem; padding:0 1.5rem; }
  .lu-filter { border:1.5px solid rgba(63,39,67,0.16); background:#fff; color:var(--plum-deep); padding:0.5rem 1.1rem; border-radius:999px; font-weight:600; font-size:0.92rem; cursor:pointer; transition:all 0.18s; }
  .lu-filter:hover { border-color:var(--gold); }
  .lu-filter.active { background:var(--plum-deep); color:#fff; border-color:var(--plum-deep); }
  .wrap { max-width:1120px; margin:0 auto; padding:0 1.5rem 5rem; }
  /* Featured hero */
  .feature { display:grid; grid-template-columns:1.1fr 1fr; background:linear-gradient(160deg,#2D1F3D,#4B2E4E); border-radius:20px; overflow:hidden; margin-bottom:2rem; box-shadow:0 26px 54px -28px rgba(42,26,44,0.7); }
  .feature-photos { display:flex; min-height:340px; }
  .feature-photos > div { flex:1; overflow:hidden; background:linear-gradient(160deg,#E8C078,#C49E4C); }
  .feature-photos img { width:100%; height:100%; object-fit:cover; object-position:top center; }
  .feature-copy { padding:2.5rem; color:#FAF6F1; display:flex; flex-direction:column; justify-content:center; }
  .feature-copy .badge { align-self:flex-start; background:var(--coral); color:#fff; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; padding:0.35rem 0.85rem; border-radius:999px; margin-bottom:1rem; }
  .feature-copy .time { color:var(--candle); font-weight:700; margin-bottom:0.4rem; }
  .feature-copy h2 { font-family:'Playfair Display',Georgia,serif; font-size:2.3rem; margin:0 0 0.5rem; line-height:1.1; }
  .feature-copy .names { color:var(--candle); font-weight:600; margin-bottom:0.8rem; }
  .feature-copy p { color:rgba(250,246,241,0.85); line-height:1.6; margin:0; }
  /* Masonry-ish grid */
  .mg { columns:3 300px; column-gap:1.5rem; }
  .mg-card { break-inside:avoid; margin-bottom:1.5rem; border-radius:16px; overflow:hidden; color:#fff; position:relative; box-shadow:0 14px 30px -20px rgba(42,26,44,0.5); }
  .mg-card .pad { padding:1.4rem 1.4rem 1.5rem; }
  .mg-time { font-weight:700; font-size:0.9rem; opacity:0.9; }
  .mg-card h3 { font-family:'Playfair Display',Georgia,serif; font-size:1.4rem; margin:0.3rem 0 0.4rem; line-height:1.15; }
  .mg-names { font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; opacity:0.95; }
  .mg-card p { font-size:0.94rem; line-height:1.5; margin:0; opacity:0.9; }
  .mg-cat { display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; padding:0.22rem 0.6rem; border-radius:999px; background:rgba(255,255,255,0.22); margin-bottom:0.6rem; }
  .cat-Music{background:linear-gradient(160deg,#E8724F,#C0562F)} .cat-Food{background:linear-gradient(160deg,#2D7961,#1F5C48)} .cat-Workshop{background:linear-gradient(160deg,#9B4A5A,#7A2E3B)} .cat-Storytelling{background:linear-gradient(160deg,#C08A3E,#96652A)}
  .cat-Kids{background:linear-gradient(160deg,#4A90C0,#356B94)} .cat-DJ{background:linear-gradient(160deg,#A96BAB,#7E4A80)} .cat-Market{background:linear-gradient(160deg,#C49E4C,#9C7A32)} .cat-Host{background:linear-gradient(160deg,#7A8F4A,#5B6C34)}
  @media(max-width:760px){ .feature{grid-template-columns:1fr;} .lu-head h1{font-size:2.2rem;} }
</style>
</head>
<body>
  <div class="lu-topbar">
    <img src="logo.jpg" alt="Noula">
    <a href="index.html">← Back to site</a>
  </div>
  <div class="lu-head">
    <div class="lu-eyebrow">Option C · Editorial</div>
    <h1>Who's making the day</h1>
    <p>A headline moment, then everything else happening across Noula Day 2026.</p>
  </div>
  <div class="lu-filters" id="filters"></div>
  <div class="wrap">
    <div id="feature"></div>
    <div class="mg" id="mg"></div>
  </div>

<script>
const DAY = [
  {time:'12:00', title:"Doors & Makers' Market", cat:'Market', people:['Noula team'], desc:'French Caribbean makers, crafts and food stalls, all day.'},
  {time:'12:30', title:"Kids' Ka drumming workshop", cat:'Kids', people:['Ti-Moun crew'], desc:'Little hands on the gwoka drum.'},
  {time:'13:00', title:'Madras tying workshop', cat:'Workshop', people:['Sandra L.'], desc:'Fold and tie the traditional madras headwrap.'},
  {time:'14:00', title:'Accras de morue · demo', cat:'Food', people:['Valerie'], desc:'The beloved Antillean salt-cod fritter, live.'},
  {time:'15:00', title:'Créole storytelling', cat:'Storytelling', people:['Man Lucie'], desc:'Tales and riddles from the islands.'},
  {time:'16:00', title:'Gwoka drum circle', cat:'Music', people:['Ka Kolektif'], desc:'An open circle — everyone welcome.'},
  {time:'21:30', title:'Afterparty · DJ set', cat:'DJ', people:['DJ Zouk'], desc:'Dancing the day into the night.'},
];
const FEATURE = {time:'18:30', title:'Chanté Nwèl · live set', cat:'Music', people:[['Blodè Prens','images/artists/blode-prens.png'],['Charlz','images/artists/charlz.png']], desc:'The heart of the evening — Créole Christmas carols, biguine and kompa, sung together.'};
const cats = ['All', ...Array.from(new Set([FEATURE, ...DAY].map(d=>d.cat)))];
const filters=document.getElementById('filters'), mg=document.getElementById('mg'), feat=document.getElementById('feature');
let active='All';
function initials(n){ return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function renderFeature(){
  if(active!=='All' && active!==FEATURE.cat){ feat.innerHTML=''; return; }
  const photos = FEATURE.people.map(p=>`<div><img src="${p[1]}" alt="${p[0]}"></div>`).join('');
  const names = FEATURE.people.map(p=>p[0]).join(' · ');
  feat.innerHTML = `<div class="feature"><div class="feature-photos">${photos}</div>
    <div class="feature-copy"><span class="badge">Headline set</span><div class="time">${FEATURE.time}</div>
    <h2>${FEATURE.title}</h2><div class="names">${names}</div><p>${FEATURE.desc}</p></div></div>`;
}
function render(){
  renderFeature();
  mg.innerHTML='';
  DAY.filter(d=>active==='All'||d.cat===active).forEach(d=>{
    const names=d.people.map(p=>Array.isArray(p)?p[0]:p).join(' · ');
    const card=document.createElement('div'); card.className='mg-card cat-'+d.cat;
    card.innerHTML=`<div class="pad"><span class="mg-cat">${d.cat}</span><div class="mg-time">${d.time}</div><h3>${d.title}</h3><div class="mg-names">${names}</div><p>${d.desc}</p></div>`;
    mg.appendChild(card);
  });
}
cats.forEach(c=>{
  const b=document.createElement('button'); b.className='lu-filter'+(c==='All'?' active':''); b.textContent=c;
  b.onclick=()=>{ active=c; document.querySelectorAll('.lu-filter').forEach(x=>x.classList.toggle('active',x===b)); render(); };
  filters.appendChild(b);
});
render();
</script>
</body>
</html>
